services:
  - type: web
    name: baby-app-next
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon の接続文字列を Render Dashboard で手動設定
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://baby-app-next.onrender.com"
      - key: TZ
        value: "Asia/Tokyo"
      - key: LLM_PROVIDER
        value: "openai"  # "openai" または "google"
      - key: LLM_API_KEY
        sync: false  # APIキーを Render Dashboard で手動設定
      - key: LLM_MODEL
        sync: false  # 未設定時は provider に応じて自動選択（gpt-4o-mini / gemini-2.0-flash）
