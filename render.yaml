services:
  # 1. バックエンド: FastAPI (Python Native Web Service)
  - type: web
    name: baby-api-next
    runtime: python
    autoDeploy: false
    plan: free
    buildCommand: >-
      pip install uv &&
      uv pip install -r requirements.txt &&
      cd frontend &&
      corepack enable pnpm &&
      pnpm install --frozen-lockfile --store-dir /opt/render/.pnpm-store &&
      pnpm build
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: DATABASE_URL
        sync: false  # Neon の接続文字列を Render Dashboard で設定
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TZ
        value: "Asia/Tokyo"
      - key: LLM_PROVIDER
        value: "google"
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: "gemini-2.0-flash"
      - key: PYTHON_VERSION
        value: "3.10.12"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
