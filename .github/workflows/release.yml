name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  validate-schema:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Check for schema drift
        run: |
          if ! git diff --quiet frontend/openapi.json; then
            echo "::error::frontend/openapi.json is out of date."
            echo "Run 'python scripts/export_openapi.py' and commit the result."
            git diff frontend/openapi.json
            exit 1
          fi

  release:
    name: Release
    needs: validate-schema
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Get latest tag before release
        id: pre_release
        run: |
          git fetch --tags
          echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')" >> $GITHUB_OUTPUT

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Check if new release was published
        id: check_release
        run: |
          git fetch --tags
          NEW_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo 'none')
          if [ "$NEW_TAG" != "${{ steps.pre_release.outputs.tag }}" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "New release published: $NEW_TAG"
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "No new release. Skipping deploy."
          fi

      - name: Trigger Render Deploy
        if: steps.check_release.outputs.published == 'true'
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_HOOK_URL" ]; then
            curl -X POST "$DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL is not set. Skipping deploy trigger."
          fi
