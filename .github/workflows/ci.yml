name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-frontend-build:
    name: Validate Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: Build frontend
        run: cd frontend && pnpm build

  validate-backend-tests:
    name: Validate Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/postgres
          USE_NEON_TESTS: "1"
        run: uv run pytest tests/ -q

  validate-alembic-drift:
    name: Validate Alembic Schema Drift
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Check multiple heads
        run: |
          HEADS_COUNT=$(uv run alembic heads | grep "(head)" | wc -l)
          if [ "$HEADS_COUNT" -gt 1 ]; then
            echo "::error::Multiple Alembic heads detected. Please merge them."
            exit 1
          fi

      - name: Check schema drift
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        run: |
          uv run alembic upgrade head
          uv run alembic check

  validate-schema:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Generate OpenAPI schema
        run: uv run python scripts/export_openapi.py

      - name: Check for schema drift
        run: |
          if ! git diff --quiet frontend/openapi.json; then
            echo "::error::frontend/openapi.json is out of date."
            echo "Run 'npm run schema:generate' and commit the result."
            git diff frontend/openapi.json
            exit 1
          fi

      - name: Check requirements.txt drift
        run: |
          uv export --no-dev --no-hashes -o /tmp/requirements.txt
          if ! diff -q requirements.txt /tmp/requirements.txt > /dev/null; then
            echo "::error::requirements.txt is out of date."
            echo "Run 'uv export --no-dev --no-hashes -o requirements.txt' and commit the result."
            diff requirements.txt /tmp/requirements.txt
            exit 1
          fi
          uv export --group dev --no-hashes -o /tmp/requirements-dev.txt
          if ! diff -q requirements-dev.txt /tmp/requirements-dev.txt > /dev/null; then
            echo "::error::requirements-dev.txt is out of date."
            echo "Run 'uv export --group dev --no-hashes -o requirements-dev.txt' and commit the result."
            diff requirements-dev.txt /tmp/requirements-dev.txt
            exit 1
          fi
