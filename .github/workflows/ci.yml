name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  validate-frontend-build:
    name: Validate Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest
          run_install: false

      - name: Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: Lint
        run: cd frontend && pnpm lint

      - name: Build frontend
        run: cd frontend && pnpm build

  validate-backend-tests:
    name: Validate Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

  validate-schema:
    name: Validate OpenAPI Schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate OpenAPI schema
        run: python scripts/export_openapi.py

      - name: Check for schema drift
        run: |
          if ! git diff --quiet frontend/openapi.json; then
            echo "::error::frontend/openapi.json is out of date."
            echo "Run 'python scripts/export_openapi.py' and commit the result."
            git diff frontend/openapi.json
            exit 1
          fi
