[project]
name = "baby"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "bcrypt>=4.0.0",
    "email-validator>=2.1.1",
    "psycopg2-binary>=2.9.9",
    "openai>=1.30.0",
    "boto3>=1.34.0",
    "pywebpush",
    "httpx>=0.27.0",
    "google-genai",
    "apscheduler>=3.11.2",
]

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "testcontainers[postgres]>=4.14.1",
]
