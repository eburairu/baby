services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: baby_dev
      POSTGRES_USER: baby
      POSTGRES_PASSWORD: baby
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baby -d baby_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
